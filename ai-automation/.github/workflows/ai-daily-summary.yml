name: Daily AI Summary

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 18:00 UTC
  workflow_dispatch:  # 支持手动触发

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull_requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get recent activity
        id: activity
        run: |
          # 获取最近 24 小时的活动
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          git log --since="24 hours ago" --pretty=format:"%h - %s (%an)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "open_issues<<EOF" >> $GITHUB_OUTPUT
          gh issue list --state open --limit 10 --json number,title,labels,createdAt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "open_prs<<EOF" >> $GITHUB_OUTPUT
          gh pr list --state open --limit 10 --json number,title,author,createdAt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Summary
        id: summary
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl -X POST $OPENAI_BASE_URL/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "kilo-auto",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a project manager assistant. Analyze the following daily activity and provide a concise summary with key highlights, action items, and priorities."
                },
                {
                  "role": "user",
                  "content": "Daily Activity Report:\n\nCommits:\n${{ steps.activity.outputs.commits }}\n\nOpen Issues:\n${{ steps.activity.outputs.open_issues }}\n\nOpen PRs:\n${{ steps.activity.outputs.open_prs }}"
                }
              ],
              "temperature": 0.5,
              "max_tokens": 1500
            }' > summary.json

          cat summary.json | jq -r '.choices[0].message.content' > summary.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat summary.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Daily Summary to Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const summary = `${{ steps.summary.outputs.summary }}`;
            
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily AI Summary - ${date}`,
              body: `## 📊 Daily Project Summary\n\n${summary}\n\n---\n*Auto-generated by AI Automation • Model: kilo-auto*`,
              labels: ['ai-summary', 'daily-report']
            };

            // 创建或更新日报
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ai-summary,daily-report',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              // 更新现有日报
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: issue.body
              });
            } else {
              // 创建新日报
              await github.rest.issues.create(issue);
            }

      - name: Send Slack Notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "📊 Daily AI Summary for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📊 Daily AI Summary*\n${{ steps.summary.outputs.summary }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
