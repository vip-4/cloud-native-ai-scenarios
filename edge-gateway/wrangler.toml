name = "edge-ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
ALLOWED_ORIGINS = "*"
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WINDOW = "60"

# Secrets (injected via CI: wrangler secret put LITELLM_API_KEY)
# LITELLM_API_KEY (set in GitHub Actions)
# LITELLM_API_BASE (set in GitHub Actions)
