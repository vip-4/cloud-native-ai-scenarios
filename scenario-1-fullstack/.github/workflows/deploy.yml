# GitHub Actions CI/CD - 生产部署流水线
# 触发条件: push 到 main/release 分支 或 PR 到 main
# 流程: 逻辑检查 → 数据库迁移 → 构建 → 测试 → 部署 Worker → 健康检查

name: "CI/CD: Fullstack Web App Deploy"

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持手动触发

env:
  NODE_VERSION: "20"
  CACHE_DEPENDENCY_PATH: "**/package-lock.json"

jobs:
  # ==================== 代码质量检查 ====================
  lint-and-typecheck:
    name: "🎯 代码质量检查"
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 执行 ESLint
        run: npm run lint

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Worker 语法验证
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ==================== 单元测试 ====================
  test:
    name: "🧪 单元测试"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

  # ==================== 数据库迁移 ====================
  migrate-database:
    name: "🗄️ 数据库迁移"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 执行数据库迁移 (推送到 Neon)
        run: npx drizzle-kit push
        env:
          # 项目根目录下执行（scenario-1-fullstack 文件夹）
          WORKING_DIR: scenario-1-fullstack
          # Neon 连接串（通过 GitHub Secrets 注入）
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 迁移结果通知
        run: |
          echo "✅ 数据库迁移完成"
          echo "· 迁移时间: $(date -u)"

  # ==================== 部署到生产 ====================
  deploy-production:
    name: "🚀 部署到 Cloudflare Workers"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scenario-1-fullstack
    needs: [migrate-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 构建 Worker
        run: npm run build

      - name: 部署到 Cloudflare Workers
        id: deploy
        run: |
          # 部署 Worker 并捕获输出
          DEPLOY_OUTPUT=$(npx wrangler publish 2>&1)
          echo "$DEPLOY_OUTPUT"

          # 从输出中提取 Worker URL
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1)
          if [ -z "$WORKER_URL" ]; then
            # 兜底: 使用命名模式生成 URL（通过 API 获取 subdomain）
            SUBDOMAIN_URL="https://scenario-1-fullstack.<subdomain>.workers.dev"
            WORKER_URL="$SUBDOMAIN_URL"
          fi

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Worker URL: $WORKER_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 部署完成通知
        run: |
          echo "✅ 部署完成"
          echo "· Worker: ${{ steps.deploy.outputs.worker_url }}"
          echo "· 健康检查: ${{ steps.deploy.outputs.worker_url }}/api/health"
          echo "· 部署时间: $(date -u)"

  # ==================== 生产健康检查 ====================
  health-check:
    name: "🩺 生产环境健康检查"
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: 检查 Worker 健康状态
        id: health_check
        run: |
          if [ -z "${{ needs.deploy-production.outputs.worker_url }}" ]; then
            echo "⚠️ 无法获取 Worker URL（可能需要在 Cloudflare 账号中绑定 workers.dev 子域名）"
            exit 0
          fi

          WORKER_URL="${{ needs.deploy-production.outputs.worker_url }}"
          echo "🔍 正在检查: $WORKER_URL/api/health"

          # 等待部署生效（最长 60 秒）
          for i in $(seq 1 6); do
            RESPONSE=$(curl -sf -w "\n%{http_code}" "$WORKER_URL/api/health" 2>/dev/null || true)
            BODY=$(echo "$RESPONSE" | head -n 1)
            CODE=$(echo "$RESPONSE" | tail -n 1)

            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"status":"ok"'; then
              echo "✅ 健康检查通过 ($CODE)"
              echo "· 响应: $BODY"
              exit 0
            fi
            echo "⏳ 等待部署生效... ($i/6)"
            sleep 10
          done

          echo "⚠️ 健康检查超时（Worker 可能仍在注册或 API 路由异常）"
          curl -v "$WORKER_URL/api/health" || true
          exit 1

      - name: API 功能验证
        run: |
          WORKER_URL="${{ needs.deploy-production.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️ 跳过 API 验证（无 Worker URL）"
            exit 0
          fi

          # 1. 获取用户列表
          echo "📋 测试 GET /api/users"
          USERS=$(curl -sf "$WORKER_URL/api/users")
          echo "$USERS" | head -c 200
          echo ""

          # 2. 测试数据统计
          echo "📊 测试 GET /api/stats"
          STATS=$(curl -sf "$WORKER_URL/api/stats")
          echo "$STATS"
          echo ""

          echo "✅ 全部 API 验证通过"

  # ==================== 通知（可选） ====================
  notify:
    name: "📮 部署结果通知"
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always() && github.event_name == 'workflow_dispatch'
    steps:
      - name: 显示部署结果
        run: |
          if [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "✅ 生产部署成功"
          else
            echo "✅ 部署完成（健康检查跳过）"
          fi
          echo "· 提交: ${{ github.sha }}"
          echo "· 分支: ${{ github.ref }}"