name: "Deploy AI Static Site to Cloudflare Pages"

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "static-site/**"

jobs:
  deploy-pages:
    name: "🚀 部署 AI 静态站到 Cloudflare Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: static-site
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 wrangler
        run: npm install --no-save wrangler@3

      - name: 创建 Cloudflare Pages 项目（幂等）
        continue-on-error: true
        run: |
          npx wrangler pages project create ai-static-site --production-branch master || echo "项目已存在，跳过创建"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 设置 LITELLM_API_KEY Secret
        run: echo "$LITELLM_API_KEY" | npx wrangler pages secret put LITELLM_API_KEY --project-name ai-static-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}

      - name: 设置 LITELLM_API_BASE Secret
        run: echo "$LITELLM_API_BASE" | npx wrangler pages secret put LITELLM_API_BASE --project-name ai-static-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LITELLM_API_BASE: ${{ secrets.LITELLM_API_BASE }}

      - name: 部署到 Cloudflare Pages
        id: deploy
        run: |
          set +e
          DEPLOY_OUTPUT=$(npx wrangler pages deploy . --project-name ai-static-site --branch master 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$DEPLOY_OUTPUT"
          echo "exit_code=$EXIT_CODE"

          PAGE_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Page URL: $PAGE_URL"

          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 部署完成通知
        run: |
          echo "✅ 部署完成"
          echo "· Page: ${{ steps.deploy.outputs.page_url }}"
          echo "· 时间: $(date -u)"

  # ==================== 生产健康检查 ====================
  health-check:
    name: "🩺 生产环境健康检查"
    runs-on: ubuntu-latest
    needs: [deploy-pages]
    steps:
      - name: 检查页面与搜索 API
        run: |
          PAGE_URL="${{ needs.deploy-pages.outputs.page_url }}"
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL="https://ai-static-site.pages.dev"
            echo "⚠️ 未从部署步骤获取 URL，回退到默认域名"
          fi

          echo "🔍 检查页面: $PAGE_URL"
          for i in $(seq 1 6); do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$PAGE_URL" 2>/dev/null || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ 页面健康 ($CODE)"
              break
            fi
            echo "⏳ 等待部署生效... ($i/6)"
            sleep 10
            if [ "$i" = "6" ]; then
              echo "❌ 页面检查失败"
              exit 1
            fi
          done

          echo "🔍 测试 /api/search"
          BODY=$(curl -sf -X POST "$PAGE_URL/api/search" \
            -H "Content-Type: application/json" \
            -d '{"query":"websocket 聊天"}' || true)
          echo "$BODY" | head -c 300
          echo ""
          echo "$BODY" | grep -q "results" && echo "✅ AI 搜索验证通过" || echo "⚠️ AI 搜索未返回预期结构"