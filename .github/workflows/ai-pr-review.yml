name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            curl -sL "${{ github.event.pull_request.diff_url }}" > pr.diff
            echo "diff_size=$(wc -c < pr.diff)" >> $GITHUB_OUTPUT
          else
            echo "diff_size=0" >> $GITHUB_OUTPUT
          fi

      - name: AI Review
        id: ai_review
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ steps.diff.outputs.diff_size }}" != "0" ]; then
            curl -X POST $OPENAI_BASE_URL/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "model": "kilo-auto",
                "messages": [
                  {
                    "role": "system",
                    "content": "You are an expert code reviewer. Analyze the following PR diff and provide: 1) Summary of changes, 2) Potential issues or bugs, 3) Security concerns, 4) Performance implications, 5) Suggestions for improvement. Be concise and actionable."
                  },
                  {
                    "role": "user",
                    "content": "Review this PR diff:\n\n'"$(cat pr.diff)"'"
                  }
                ],
                "temperature": 0.3,
                "max_tokens": 2000
              }' > review.json

            cat review.json | jq -r '.choices[0].message.content' > review.txt
            echo "review<<EOF" >> $GITHUB_OUTPUT
            cat review.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "No diff available for review"
          fi

      - name: Post PR Review Comment
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.ai_review.outputs.review }}`;
            
            const comment = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*Generated by FreeLLMAPI • Model: kilo-auto*`
            };

            github.rest.issues.createComment(comment);

      - name: Add PR Label
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff_size != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.ai_review.outputs.review }}`;
            
            let label = 'ai-reviewed';
            if (review.includes('security') || review.includes('Security')) {
              label = 'needs-security-review';
            } else if (review.includes('performance') || review.includes('Performance')) {
              label = 'needs-performance-review';
            }

            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

      - name: Send Feishu Notification
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff_size != '0' && secrets.FEISHU_APP_ID != '' && secrets.FEISHU_CHAT_ID != ''
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          REVIEW: ${{ steps.ai_review.outputs.review }}
        run: |
          REVIEW_TEXT="${{ steps.ai_review.outputs.review }}"
          TEXT="🤖 AI 代码审查完成\n\nPR: #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}\n\n$REVIEW_TEXT"
          bash "${GITHUB_WORKSPACE}/scripts/send-feishu-notification.sh" 2>/dev/null || \
          curl -fsS -X POST 'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"app_id\":\"$FEISHU_APP_ID\",\"app_secret\":\"$FEISHU_APP_SECRET\"}" >/tmp/tok.json
          TOKEN=$(jq -r '.tenant_access_token' /tmp/tok.json)
          CONTENT=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}, ensure_ascii=False))' "$TEXT")
          curl -fsS -X POST "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"receive_id\":\"$FEISHU_CHAT_ID\",\"msg_type\":\"text\",\"content\":$CONTENT}" || echo "⚠️ 飞书通知失败(不影响主流程)"
