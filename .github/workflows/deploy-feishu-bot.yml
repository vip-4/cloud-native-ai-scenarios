name: "Deploy Feishu AI Bot to Cloudflare Workers"

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "feishu-ai-bot/**"

jobs:
  deploy:
    name: "🚀 部署飞书 AI 机器人"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: feishu-ai-bot
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        run: npm install

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 部署到 Cloudflare Workers
        id: deploy
        run: |
          set +e
          DEPLOY_OUTPUT=$(npx wrangler deploy 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$DEPLOY_OUTPUT"
          echo "exit_code=$EXIT_CODE"
          WORKER_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Worker URL: $WORKER_URL"
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 设置 LITELLM_API_KEY Secret
        run: echo "$LITELLM_API_KEY" | npx wrangler secret put LITELLM_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}

      - name: 设置 LITELLM_API_BASE Secret
        run: echo "$LITELLM_API_BASE" | npx wrangler secret put LITELLM_API_BASE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LITELLM_API_BASE: ${{ secrets.LITELLM_API_BASE }}

      - name: 设置 FEISHU_APP_ID Secret
        run: echo "$FEISHU_APP_ID" | npx wrangler secret put FEISHU_APP_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}

      - name: 设置 FEISHU_APP_SECRET Secret
        run: echo "$FEISHU_APP_SECRET" | npx wrangler secret put FEISHU_APP_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: 部署完成通知
        run: |
          echo "✅ 飞书 AI 机器人部署完成"
          echo "· Worker: ${{ steps.deploy.outputs.worker_url }}/health"
          echo "· Webhook: ${{ steps.deploy.outputs.worker_url }}/feishu/webhook"

  health-check:
    name: "🩺 健康检查"
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: 检查 Worker 健康状态
        run: |
          WORKER_URL="${{ needs.deploy.outputs.worker_url }}"
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️ 未能获取 Worker URL"
            exit 0
          fi
          for i in $(seq 1 6); do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "$WORKER_URL/health" 2>/dev/null || true)
            echo "health: $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ 健康检查通过"
              exit 0
            fi
            sleep 10
          done
          echo "❌ 健康检查失败"
          exit 1